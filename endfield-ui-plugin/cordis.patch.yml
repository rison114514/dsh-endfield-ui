# Endfield workbench for DSH 0.1.2-alpha.5 + dsh-better-sidebar 0.18.0-alpha.0.
# Keep this order: the public services must mount before the Endfield adapter.
# better-sidebar is a nested dependency of this package; do not also
# `dsh plugin add dsh-better-sidebar` or the host half will double-mount.
- insert:
    - id: better-sidebar
      name: 'dsh-better-sidebar'
    - id: dsh-shikitor
      name: 'dsh-shikitor'
    - id: endfield-ui
      name: '@rison/dsh-endfield-ui'
