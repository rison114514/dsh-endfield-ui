# Endfield visual adapter for DSH 0.2.0-rc.2.
#
# dsh-better-sidebar is deliberately NOT mounted from this bundle. DSH scans
# client modules from root profile entries, so mounting a transitive dependency
# here only works accidentally with pnpm's hoisted linker. Install the pinned
# sidebar as a direct profile plugin in the same `dsh plugin add` command. The
# Endfield client attaches its OBJECTIVE integration when the public
# `betterSidebar` service becomes available and otherwise degrades cleanly.
- insert:
    - id: endfield-ui
      name: '@rison/dsh-endfield-ui'
